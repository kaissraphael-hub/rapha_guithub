name: Criar Executavel Organizador
on: [push] # Ele vai rodar toda vez que você enviar algo novo

jobs:
  build:
    runs-on: windows-latest # Usa um servidor Windows para criar o .exe
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar PyInstaller
        run: |
          pip install pyinstaller
          
      - name: Gerar Executável
        run: |
          # ATENÇÃO: Mude 'organizador.py' para o nome real do seu arquivo!
          pyinstaller --onefile --console --name "OrganizadorRapha" organizar_pastas.py
          
      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: Organizador-Windows
          path: dist/OrganizadorRapha.exe
