name: Criar Executavel Organizador
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: |
          # Se o seu arquivo de organizar tiver outro nome, mude aqui:
          pyinstaller --onefile --console --name "OrganizadorPastas" organizar_pastas.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Organizador-Windows
          path: dist/OrganizadorPastas.exe
